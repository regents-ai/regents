openapi: 3.1.0
info:
  title: Ash Platform API
  version: 0.1.0
paths:
  /api/techtree/v1/tree/nodes:
    get:
      operationId: listTreeNodes
      summary: List public Techtree nodes
      security: []
      parameters: []
      x-pagination: none
      responses:
        "200":
          description: Public Techtree nodes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Node"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "500": {$ref: "#/components/responses/InternalError"}
components:
  responses:
    InvalidRequest:
      description: Unsupported request parameters
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    InternalError:
      description: The request could not be completed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
  schemas:
    Node:
      type: object
      additionalProperties: false
      required: [id, tree_id, title, summary, payload_hash, published_at]
      properties:
        id: {type: string, format: uuid}
        tree_id: {type: string, format: uuid}
        title: {type: string}
        summary: {type: [string, "null"]}
        payload_hash: {type: [string, "null"]}
        published_at: {type: string, format: date-time}
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
