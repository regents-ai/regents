  resolved_compiler_groups:
    - solc: 0.8.26+commit.8a97fa7a
      ceremony_group: false
      reason: reached_only_from_the_single_exact_0_8_26_source_unit
    - solc: 0.8.28+commit.7893614a
      ceremony_group: true
      reason: reached_from_the_exact_0_8_28_script_and_test_units_that_build_this_packet
    - solc: newest_installed_compiler_satisfying_caret_0_8_26
      ceremony_group: false
      observed_on_this_gate: 0.8.33+commit.64118f21
      reason: no_source_unit_or_repository_setting_pins_this_group
  caret_pragma_is_not_a_version: >-
    Almost every source behind this ceremony declares `^0.8.26`, which is a range
    and never means 0.8.26 or 0.8.28. Under auto_detect_solc that range resolves
    to the newest installed compatible compiler, so it tracks the machine rather
    than the repository. Only the exact-0.8.28 artifact variants named in this
    manifest are ceremony provenance.
  other_repository_source_units: >-
    Sources outside this manifest compile in whichever of the three groups above
    their own pragmas and importers place them. No compiler setting is changed
    and no cross-compiler equivalence is claimed here.
