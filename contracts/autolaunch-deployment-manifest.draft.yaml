  produced it, the repository's resolved compiler groups are stated in full, the
  local preparation preflight is recorded as its own object, and the ceremony
  preflight and local-evidence boundary are stated explicitly. Shape and meaning
  changed, so the schema version advances. No bytecode hash, binding digest,
  deployment output, child initcode, predicted address, gas ceiling, compiler
  setting, or deployed-contract source changed.
