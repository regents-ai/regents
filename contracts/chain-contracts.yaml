        source_tree: bb660324bb1d5cc322adeb243b0bd51779821fcb
        abi_path: abi/subject-splitter-v1.json
        abi_sha256: d22d5f5820ecf7cd79955ef35d86682ae693d3f274bc7e7a9088d1b22d69aae2
        runtime_keccak256: "0x51f75aa1524323c76b393e14aa236909badf323187512949d4356163316f749e"
        implementation_provenance: >-
          repos/autolaunch-contracts f4114f5276386f48bf8dc53ee344189d98c8896e
          src/revenue/SubjectSplitterV1.sol defines the four caller-only customer calls at
          lines 201-250, each acting for msg.sender alone with no recipient argument, and the
          reads this lane prepares against at lines 60-81 and 315-317. The ABI file is derived
          from the artifact that pinned build produced, whose metadata keccak256 for that
          source is 0xb9232cc9efd7a684a40c82d1f0907fdef1e8417d6cb109515cc6e4222b3d92e1.
        interface_note: >-
          stake and unstake take only uint256; there is no recipient-argument overload and no
          claimUSDC. claim(address) and claimAll() settle for msg.sender alone and return early
          when nothing is owed, so a canonical success with no Claimed log is a truthful no-op.
          Line 420 divides each post-skim net by staked coverage of the complete 100-billion
          SUBJECT supply declared at line 57 and line 421 leaves the treasury the exact
          remainder, so the whole allocation is derived from totalStaked and the reviewed
          amount. Lines 223, 238 and 246 refuse an unstake, a claim and a claim-all alike in
          the caller's own latest stake block; the SameBlockStakeExit error they revert with
          is deliberately not derived, because _lastStakeBlock has no getter and no browser
          behavior consumes it.
        confirmation_event_signatures:
          - Staked(address,uint256)
          - Unstaked(address,uint256)
          - Claimed(address,address,uint256)
        action_ids:
