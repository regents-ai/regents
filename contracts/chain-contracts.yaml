version: 1
product: ash-platform
contracts:
  - id: base_mainnet_reviewed_evidence
    evidence_manifest: base-mainnet.json
    evidence_sha256: 015022d9e8ab67feddaf04178413aedd36cc3a4e7471da9dc13e36909051c587
    chain_target: base-mainnet
    authority: evidence_only
    # `authority` names the pinned evidence source; the list below separately
    # records founder release authority. The runtime, predecessor-hint source,
    # projection and entitlement freezes in regent-alv1.6, 490.8.2/.3 and
    # 839.5.1 govern future Autolaunch admission and do not gate these
    # separately reviewed staking actions.
    admitted_prepared_actions:
      - regent_revenue_staking.stake
      - regent_revenue_staking.unstake
      - regent_revenue_staking.claim_usdc
      - regent_revenue_staking.claim_regent
      - regent_revenue_staking.claim_and_restake_regent
    reviewed_action_evidence:
      - contract_id: regent_revenue_staking
        abi_path: abi/regent-revenue-staking.json
        abi_sha256: c8c5570f76f32b72e3bdb0a062fc97cb7f74aacadf03683d796b57a765f1ca23
        action_ids:
          - stake
          - unstake
          - claim_usdc
          - claim_regent
          - claim_and_restake_regent
      - contract_id: animata_redeemer
        abi_path: abi/animata-redeemer.json
        abi_sha256: c14a490d3feefbee76fd08e5f993d987e27388cb6c78f4643e2d8010c34766fd
        action_ids:
          - approve_nft_collection
          - approve_exact_usdc
          - redeem
          - claim
      - contract_id: continuous_clearing_auction
        contract_name: IContinuousClearingAuction
        target: stored_auction_address
        source_commit: 7d7602d257733315434570f2a0c2f94f1c7b207a
        interface_note: >-
          submit_bid is the canonical five-argument submitBid(uint256,uint128,address,uint256,bytes)
          declared at Uniswap/continuous-clearing-auction src/interfaces/IContinuousClearingAuction.sol
          lines 136-142 and implemented at src/ContinuousClearingAuction.sol lines 464-482, which
          collects a non-native currency only through Permit2 at line 479. The four-argument overload
          at lines 486-493 is not prepared: it defaults prevTickPriceQ96 to FLOOR_PRICE_Q96 and walks
          every tick from the floor.
        abi_path: abi/continuous-clearing-auction.json
        abi_sha256: f687d42ad0fd981e38ba7f43baad6428014f5056a129a7bf13906f5704e5194b
        confirmation_event_signature: BidSubmitted(uint256,address,uint256,uint128)
        confirmation_event_topic0: "0x650baad5cd8ca09b8f580be220fa04ce2ba905a041f764b6a3fe2c848eb70540"
        reads:
          - id: currency
            signature: currency()
            selector: "0xe5a6b10f"
        action_ids:
          - submit_bid
      - contract_id: permit2
        contract_name: IAllowanceTransfer
        target: canonical_permit2
        address: "0x000000000022D473030F116dDEE9F6B43aC78BA3"
        source_commit: cc56ad0f3439c502c246fc5cfcc3db92bb8b7219
        address_provenance: >-
          The auction's own dependency closure names the address: Solady
          2af06408b6a204824c2ecb245779ed400b535fb5 src/utils/SafeTransferLib.sol line 64 declares
          PERMIT2 = 0x000000000022D473030F116dDEE9F6B43aC78BA3, and lines 458-484 of the same file
          are the permit2TransferFrom the auction calls. Deployed-runtime admission is a C5 gate.
        abi_path: abi/permit2.json
        abi_sha256: ced6a1b558e80e4a80c5bc1920da8cca21fa63806ac379b5c1c8ab4b6c866832
        reads:
          - id: allowance
            signature: allowance(address,address,address)
            selector: "0x927da105"
        action_ids:
          - approve
      - contract_id: quote_token_erc20
        contract_name: IERC20
        target: stored_quote_token_address
        interface_note: >-
          The only ERC-20 allowance a bid prepares is the canonical Permit2 spender; the auction
          itself is never an ERC-20 spender.
        abi_path: abi/erc20-approve.json
        abi_sha256: c3b0ea0f4cb03cf09bee2ef0ea451c976bcfb13c658f5f6d37784699d567efec
        action_ids:
          - approve_exact
      - contract_id: subject_token_erc20
        contract_name: IERC20
        target: stored_subject_token_address
        abi_path: abi/erc20-approve.json
        abi_sha256: c3b0ea0f4cb03cf09bee2ef0ea451c976bcfb13c658f5f6d37784699d567efec
        implementation_provenance: >-
          repos/autolaunch-contracts 59e1f0c195428f9d74b72223d154e1fee693c36d
          src/revenue/SubjectSplitterV1.sol:50 declares the launch's own SUBJECT binding and
          line 185 pulls exactly the staked amount through _pullExact, which lines 414-419
          hold to an exact balance delta. The only SUBJECT allowance a stake prepares is the
          exact splitter spender, using the standard nonpayable ERC-20 approve interface.
        action_ids:
          - approve_exact
      - contract_id: subject_splitter_v1
        contract_name: SubjectSplitterV1
        target: stored_subject_splitter_address
        source_commit: 59e1f0c195428f9d74b72223d154e1fee693c36d
        source_tree: d1b3d5a75ce84fe7ee042a85c9b79a91e842cc6d
        abi_path: abi/subject-splitter-v1.json
        abi_sha256: fe2c40284d036af9f155037c67b84cda2d290f0fcb82aefcba13cef288219009
        implementation_provenance: >-
          repos/autolaunch-contracts 59e1f0c195428f9d74b72223d154e1fee693c36d
          src/revenue/SubjectSplitterV1.sol defines the four caller-only customer calls at
          lines 181-221, each acting for msg.sender alone with no recipient argument, and the
          reads this lane prepares against at lines 44-68 and 276-278. The ABI file is derived
          from the artifact that pinned build produced, whose metadata keccak256 for that
          source is 0x4ed543bfb97f8a3c01bcfe606cc441cb4f8cfa46fdac370a3ebbdc9a9b7750be.
        interface_note: >-
          stake and unstake take only uint256; there is no recipient-argument overload and no
          claimUSDC. claim(address) and claimAll() settle for msg.sender alone and return early
          when nothing is owed, so a canonical success with no Claimed log is a truthful no-op.
        confirmation_event_signatures:
          - Staked(address,uint256)
          - Unstaked(address,uint256)
          - Claimed(address,address,uint256)
        action_ids:
          - stake
          - unstake
          - claim
          - claim_all
      - contract_id: payment_receiver_v1
        contract_name: PaymentReceiverV1
        target: projected_canonical_receiver_address
        source_commit: 59e1f0c195428f9d74b72223d154e1fee693c36d
        source_tree: d1b3d5a75ce84fe7ee042a85c9b79a91e842cc6d
        abi_path: abi/payment-receiver-v1.json
        abi_sha256: e587fe9dab115118dba0479e899ffa098fd83b59488fbda537037ae576a19fbd
        implementation_provenance: >-
          repos/autolaunch-contracts 59e1f0c195428f9d74b72223d154e1fee693c36d
          src/revenue/PaymentReceiverV1.sol defines pay at lines 150-160, sweep at lines
          163-170 and setReceiverNote at lines 138-145, and the bindings this lane proves
          canonical at lines 32-59. Line 132 defaults the note to the receiver's own address
          encoded as bytes32. The ABI file is derived from the artifact that pinned build
          produced, whose metadata keccak256 for that source is
          0xf0d7b5dc82f84b33f7f9dffdeceb1c91b87af7d071ac27e7e55401583bddc467.
        interface_note: >-
          A receiver is canonical only when referralBps() is 0 and the splitter's treasury is
          both beneficiary() and noteEditor(), which is the whole of the zero-referral
          treasury-bound economics this lane reviews. Canonical provenance itself comes from
          the projected canonical_receiver_address plus later C4/C5 evidence; these reads
          prove the economics, never the provenance.
        confirmation_event_signatures:
          - PaymentRouted(bytes32,bytes32,address,uint256,uint256,uint256)
          - ReceiverNoteUpdated(bytes32,bytes32)
        action_ids:
          - pay
          - sweep
          - set_receiver_note
      - contract_id: regent_erc20
        contract_name: IERC20
        target: pinned_regent_token_address
        interface_note: >-
          The only REGENT allowance a launch prepares is the exact current launch fee held by the
          reviewed factory, including the exact zero a zero fee requires. There is no additive and
          no unlimited approval, and no other spender.
        abi_path: abi/erc20-approve.json
        abi_sha256: c3b0ea0f4cb03cf09bee2ef0ea451c976bcfb13c658f5f6d37784699d567efec
        action_ids:
          - approve_exact
      - contract_id: regents_autolaunch_factory_v1
        contract_name: RegentsAutolaunchFactoryV1
        target: c5_admitted_factory_address
        source_commit: 81e17ddef773a6a825b5312e238cf3c4f5a1c0b1
        source_tree: 41c0f1ba29ceade995d1e2a5313995089bdc279a
        source_keccak256: "0xaefec10abe77a96fd376126e5bbab7e1d4a969d8cbe3356e860c1838a49f9f15"
        abi_path: abi/regents-autolaunch-factory-v1.json
        abi_sha256: 70fbb029618224ccfbbca06c14c8c49ebf9511d4af014d79c916f4eaa8d46e06
        artifact_provenance: >-
          The consumer ABI is derived from out/RegentsAutolaunchFactoryV1.sol/RegentsAutolaunchFactoryV1.json,
          a Foundry build output that the upstream repository's .gitignore excludes from version
          control. It is source authority but it is not a tracked file, so the durable fingerprint
          pinned here is source_keccak256: the compiler's own metadata Keccak-256 of
          src/factory/RegentsAutolaunchFactoryV1.sol at source_commit, which any rebuild of that
          commit reproduces.
        implementation_provenance: >-
          repos/autolaunch-contracts 81e17ddef773a6a825b5312e238cf3c4f5a1c0b1
          src/factory/RegentsAutolaunchFactoryV1.sol declares the nine-field LaunchParams at lines
          97-107 and the one customer call at lines 231-259, and the reads this lane reviews
          against at lines 123, 132, 135, 138 and 307-309.
        interface_note: >-
          launch takes one dynamic tuple and nothing else: no start block, floor price, hook, pool
          setting, salt, supply, allocation or schedule. Lines 242-246 require every metadata field
          to be nonempty within its exact byte cap, line 238 refuses a stale fee, and lines 323-324
          require the launcher's factory allowance to equal that fee exactly. setLaunchFee,
          pauseLaunches, unpauseLaunches and createPaymentReceiver are deliberately not derived.
        confirmation_event_signatures:
          - LaunchCreated(uint256,address,address,address,address,address,address,uint128,uint64,uint64)
          - LaunchFeeCollected(uint256,address,address,uint256)
        action_ids:
          - launch
      - contract_id: regent_lbp_strategy_v1
        contract_name: RegentLBPStrategy
        target: reviewed_factory_bound_strategy_address
        source_commit: 81e17ddef773a6a825b5312e238cf3c4f5a1c0b1
        source_tree: 41c0f1ba29ceade995d1e2a5313995089bdc279a
        source_keccak256: "0xde78be091e8092fad3c30d358d68533cc914fdcdd2a60bf426ff26d6372bef1f"
        abi_path: abi/regent-lbp-strategy-v1.json
        abi_sha256: 84a58d177acfbd37a193314e9e0ce3baae1cfd08647605c09d52a7bc348db682
        artifact_provenance: >-
          The consumer ABI is derived from out/RegentLBPStrategy.sol/RegentLBPStrategy.json, a
          Foundry build output that the upstream repository's .gitignore excludes from version
          control. It is source authority but it is not a tracked file, so the durable fingerprint
          pinned here is source_keccak256: the compiler's own metadata Keccak-256 of
          src/strategy/RegentLBPStrategy.sol at source_commit, which any rebuild of that commit
          reproduces.
        implementation_provenance: >-
          repos/autolaunch-contracts 81e17ddef773a6a825b5312e238cf3c4f5a1c0b1
          src/strategy/RegentLBPStrategy.sol declares factory() at line 176 and the twelve founder
          -frozen launch terms at lines 63, 66, 69, 75, 78, 81, 84, 87, 90, 109, 112 and 132.
        interface_note: >-
          Every term here is read for display only; none is an input a launcher chooses. Line 317
          refuses a required raise of zero or above MAX_REACHABLE_RAISE, and POOL_TICK_SPACING is a
          signed int24 returned sign-extended into a full word. No strategy call is prepared: this
          lane never reaches bindHook, initializeDistribution or migrate.
        action_ids: []
    validation_command: mix test test/ash_platform/wallet_actions/manifest_test.exs
