version: 1
product: ash-platform
contracts:
  - id: base_mainnet_reviewed_evidence
    evidence_manifest: base-mainnet.json
    evidence_sha256: 015022d9e8ab67feddaf04178413aedd36cc3a4e7471da9dc13e36909051c587
    chain_target: base-mainnet
    authority: evidence_only
    admitted_prepared_actions:
      - continuous_clearing_auction.submit_bid
      - continuous_clearing_auction.exit_bid
      - continuous_clearing_auction.return_quote_token
      - continuous_clearing_auction.claim_bid
      - quote_token_erc20.approve_exact
    reviewed_action_evidence:
      - contract_id: regent_revenue_staking
        abi_path: abi/regent-revenue-staking.json
        abi_sha256: c8c5570f76f32b72e3bdb0a062fc97cb7f74aacadf03683d796b57a765f1ca23
        action_ids:
          - stake
          - unstake
          - claim_usdc
          - claim_regent
          - claim_and_restake_regent
      - contract_id: animata_redeemer
        abi_path: abi/animata-redeemer.json
        abi_sha256: c14a490d3feefbee76fd08e5f993d987e27388cb6c78f4643e2d8010c34766fd
        action_ids:
          - approve_nft_collection
          - approve_exact_usdc
          - redeem
          - claim
      - contract_id: continuous_clearing_auction
        contract_name: IContinuousClearingAuction
        target: stored_auction_address
        interface_note: >-
          submit_bid uses the upstream four-argument convenience overload of the canonical
          five-argument submitBid and defaults prevTickPriceQ96 to FLOOR_PRICE_Q96; see
          Uniswap/continuous-clearing-auction src/ContinuousClearingAuction.sol lines 635-641.
        abi_path: abi/continuous-clearing-auction.json
        abi_sha256: 901e5873cc24b52eac61553bcdee68c208fb4c210e081337fdbad28f5ac61b76
        action_ids:
          - submit_bid
          - exit_bid
          - return_quote_token
          - claim_bid
      - contract_id: quote_token_erc20
        contract_name: IERC20
        target: stored_quote_token_address
        abi_path: abi/erc20-approve.json
        abi_sha256: c3b0ea0f4cb03cf09bee2ef0ea451c976bcfb13c658f5f6d37784699d567efec
        action_ids:
          - approve_exact
      - contract_id: payment_link_factory
        contract_name: PaymentLinkFactory
        target: stored_subject_factory_address
        abi_path: abi/payment-link-factory.json
        abi_sha256: 121d3ae7e3e260ade1fda995b4ba67cae9b1bf11814497d2cedd788dfb839343
        implementation_provenance: >-
          archive/repos/platform/contracts/src/revenue/PaymentLinkFactory.sol:30-36,64-115,197
          defines the PaymentLinkCreated(bytes32,address,address,string,bool) event, the four
          nonpayable calls and their address return or empty returns, and the create emission.
          Function selectors are derived from those implementation signatures. Event topic0
          is offline Keccak-256 of the canonical event signature:
          0x06c00f03aef858d7f694c6f34c8245765bedf95c92e4341eec90f78b7d24bedb.
        confirmation_event_signature: PaymentLinkCreated(bytes32,address,address,string,bool)
        confirmation_event_topic0: "0x06c00f03aef858d7f694c6f34c8245765bedf95c92e4341eec90f78b7d24bedb"
        action_ids:
          - create_payment_link
          - create_canonical_payment_link
          - set_payment_link_canonical
          - set_payment_link_receiver_state
      - contract_id: revenue_ingress_account
        contract_name: RevenueIngressAccount
        target: stored_subject_ingress_account
        abi_path: abi/revenue-ingress-account.json
        abi_sha256: 5175b02535ed6058b2abcc27215680316d634ec77c06359ae3aa9b2174366da6
        implementation_provenance: >-
          archive/repos/platform/contracts/src/revenue/RevenueIngressAccount.sol:183-206
          defines nonpayable sweepUSDC(bytes32) returning balance and recognized uint256 values;
          the selector is derived from that implementation signature.
        action_ids:
          - sweep_usdc
      - contract_id: subject_token_erc20
        contract_name: IERC20
        target: stored_subject_token_address
        abi_path: abi/erc20-approve.json
        abi_sha256: c3b0ea0f4cb03cf09bee2ef0ea451c976bcfb13c658f5f6d37784699d567efec
        implementation_provenance: >-
          archive/repos/platform/contracts/src/revenue/RevenueShareSplitterV2.sol:45
          declares the immutable stake token; RevenueShareSplitterV2.sol:174 assigns it in
          the constructor; RevenueShareSplitterV2.sol:299-310 defines the stake entrypoint
          and pull; RevenueShareSplitterV2.sol:781 enforces the exact balance delta. The
          prepared allowance uses the standard nonpayable ERC-20 approve interface.
        action_ids:
          - approve_exact
      - contract_id: revenue_share_splitter_v2
        contract_name: RevenueShareSplitterV2
        target: stored_subject_splitter_address
        abi_path: abi/revenue-share-splitter-v2.json
        abi_sha256: a21b53836c452ce8bb6c3892543cb47521ff9186a01e3327363cc5853f9da69e
        implementation_provenance: >-
          archive/repos/platform/contracts/src/revenue/RevenueShareSplitterV2.sol:299-328
          defines nonpayable stake and unstake with empty returns, while
          archive/repos/platform/contracts/src/revenue/RevenueShareSplitterV2.sol:432-442
          defines nonpayable claimUSDC(address) returning uint256 amount; selectors are
          derived from those implementation signatures.
        action_ids:
          - stake
          - unstake
          - claim_usdc
    validation_command: mix test test/ash_platform/wallet_actions/manifest_test.exs
