        implementation_provenance: >-
          repos/autolaunch-contracts f4114f5276386f48bf8dc53ee344189d98c8896e
          src/strategy/RegentLBPStrategy.sol declares factory() at line 174, the one authentic
          hook() at line 189, and the twelve founder-frozen launch terms at lines 63, 66, 69, 75,
          78, 81, 84, 87, 90, 109, 112 and 132.
        interface_note: >-
          Every term here is read for display only; none is an input a launcher chooses. Line 321
          refuses a required raise of zero or above MAX_REACHABLE_RAISE, and POOL_TICK_SPACING is a
          signed int24 returned sign-extended into a full word. Lines 681-687 are the system's only
          launch-time treasury admission: they refuse exactly the factory, this strategy, hook(),
          PoolManager, PositionManager and live staking. No strategy call is prepared: this lane
          never reaches bindHook, initializeDistribution or migrate.
        reads:
          - id: hook
            signature: hook()
            selector: "0x7f5a7c7b"
        refused_launch_treasuries:
          - id: pool_manager
            address: "0x498581fF718922c3f8e6A244956aF099B2652b2b"
          - id: position_manager
            address: "0x7C5f5A4bBd8fD63184577525326123B519429bDc"
          - id: live_staking
            address: "0xb027Dc261636E30Cbc0fE25b2F8e1ed273354AB5"
        refused_launch_treasury_provenance: >-
          The other three of the exact six are read at the reviewed block: factory and strategy
          from the launch snapshot, hook from the strategy read above. These three are frozen
          constants, declared at src/bindings/BaseBindings.sol lines 19, 20 and 21 at
          source_commit, whose Keccak-256 is
          0xcb7a62955cecd898f981c394eecffc16d55aae76bfbc09b2a452528a20d9e9c4.
        action_ids: []
