        source_keccak256: "0x365a31acbff3ba9e63160e6bf461ae28fe99dd12c7bee1e92f693d3840433108"
        abi_path: abi/regents-autolaunch-factory-v1.json
        abi_sha256: 12517d23c31364c207fda412e0e4ca95fda4ffb58272a4128d58e94703a0f538
        runtime_keccak256: "0xc6a3cc79c3a28e75b30cf55091e921773de32f7798d474712f8e1e24f1a021d4"
        factory_bound_splitter_runtime_keccak256: "0x51f75aa1524323c76b393e14aa236909badf323187512949d4356163316f749e"
        artifact_provenance: >-
          The consumer ABI is derived from out/RegentsAutolaunchFactoryV1.sol/RegentsAutolaunchFactoryV1.json,
          a Foundry build output that the upstream repository's .gitignore excludes from version
          control. It is source authority but it is not a tracked file, so the durable fingerprint
          pinned here is source_keccak256: the compiler's own metadata Keccak-256 of
          src/factory/RegentsAutolaunchFactoryV1.sol at source_commit, which any rebuild of that
          commit reproduces. runtime_keccak256 is the frozen-artifact runtime hash the pinned
          release manifest records for that same commit, and
          factory_bound_splitter_runtime_keccak256 is the SubjectSplitterV1 implementation hash
          line 86-87 of that source admits by exact code hash.
        implementation_provenance: >-
          repos/autolaunch-contracts f4114f5276386f48bf8dc53ee344189d98c8896e
          src/factory/RegentsAutolaunchFactoryV1.sol declares the eight-field LaunchParams at lines
          97-106 and the one customer call at lines 239-267, and the reads this lane reviews
          against at lines 121, 130, 138, 141 and 340-342.
        interface_note: >-
          launch takes one dynamic tuple and nothing else: no recovery admin, start block, floor
          price, hook, pool setting, salt, supply, allocation or schedule. Lines 250-254 require
          every metadata field to be nonempty within its exact byte cap, line 246 refuses a stale
          fee, and lines 356-357 require the launcher's factory allowance to equal that fee
          exactly. Line 138 starts every factory paused, so line 243 refuses every launch until
          governance opens it. There is no recovery authority anywhere in the graph: recovery is
          permissionless to the fixed launch treasury. setLaunchFee, pauseLaunches,
          unpauseLaunches, createPaymentReceiver, registerCanonicalPaymentReceiver and
          launchIdOfPaymentReceiver are deliberately not derived.
        confirmation_event_signatures:
          - LaunchCreated(uint256,address,address,address,address,address,uint128,uint64,uint64)
          - LaunchFeeCollected(uint256,address,address,uint256)
        action_ids:
          - launch
