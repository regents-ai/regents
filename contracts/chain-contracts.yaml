        runtime_keccak256: "0xdfdda2748e2d1ce9f13d99f6b76ea120fec2f8727f9ea97772d0445f8e5b699f"
        artifact_provenance: >-
          The consumer ABI is derived from out/RegentLBPStrategy.sol/RegentLBPStrategy.json, a
