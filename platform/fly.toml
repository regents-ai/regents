primary_region = "iad"

# Fly stops a machine with SIGINT unless told otherwise, and the VM answers
# SIGINT by halting at once, cutting open connections and running jobs. SIGTERM
# shuts it down in order: open connections drain and running jobs finish, well
# inside the timeout.
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "Dockerfile"

# Blue-green: the new machine starts beside the old one and takes traffic only
# once /healthz answers, then the old one stops.
[deploy]
  release_command = "/app/bin/migrate"
  strategy = "bluegreen"

[env]
  PORT = "4000"
  REGENTS_DEPLOYMENT_ROLE = "production"
  SIWA_SERVER_URL = "https://siwa.regents.sh"
  SIWA_AUDIENCE = "regents"
  TECHTREE_BOOTSTRAP_CHANNEL = "stable"
  AUTOLAUNCH_AGENT_SWAPS = "true"
  AUTOLAUNCH_AGENT_PAYMENTS = "true"
  KEYFLEET_GRAPH_URL = "http://graph.process.keyfleet.internal:4400"
  PATCHBAY_SHOTS_URL = "http://patchbay-shots.flycast"

[metrics]
  port = 9091
  path = "/metrics"

[http_service]
  internal_port = 4000
  force_https = true

# Keep one web instance until cross-instance long-poll resumption is fixed.
# Machine count is managed by `fly scale count 1`; deploy with `--ha=false`.
# Performance 2x / 4 GB gives all five folded products comfortable headroom in one BEAM VM.
[[vm]]
  cpu_kind = "performance"
  cpus = 2
  memory_mb = 4096

[[http_service.checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  protocol = "http"
  timeout = "2s"

  [http_service.checks.headers]
    Host = "localhost"
