            doesn't fit the operation; the hint names the fields it takes.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/NotebookCursorError"}
                  - {$ref: "#/components/schemas/NotebookFileRefusedError"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/NotebookRunUnavailable"}
        default: {$ref: "#/components/responses/SignInRefusal"}
