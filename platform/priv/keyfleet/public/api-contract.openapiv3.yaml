        again button does. Anyone may send it while the Key's request was refused. Blocked "Traits
        drawn" once the draw is made, "Draw on its way" while a request waits, "Wait ended: it
        never gets traits" once a request's wait was ended, "Its number gives its traits" for a
        Key dealt its card by number, which never draws, and "Its fleet's deck isn't set yet"
        until the fleet's deck is on the chain. Nothing is sent here: the signing wallet sends it
        itself, on Base.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
        - {$ref: "#/components/parameters/TokenId"}
      requestBody: {$ref: "#/components/requestBodies/AgentEmpty"}
      responses:
        "403": {$ref: "#/components/responses/AgentNotPaired"}
        "200":
          description: The transaction and the Key it asks for
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChainKeyStep"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "404": {$ref: "#/components/responses/KeyNotFound"}
        "409": {$ref: "#/components/responses/AgentFleetNotOnChain"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/AgentBodyRefused"}
        "503": {$ref: "#/components/responses/AgentChainUnavailable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/SignInRefusal"}
