        at once, paid to the signing wallet, as the Key page's Claim Key button does. Blocked
        "Already claimed" once the Key has left the contract, "Only its Pass's holder can claim"
        while the signing wallet doesn't hold Pass N, and "Its Pass was burned" for good once the
        Pass is burned. Nothing is sent here: the signing wallet sends it itself, on Base.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
        - {$ref: "#/components/parameters/TokenId"}
      requestBody: {$ref: "#/components/requestBodies/AgentEmpty"}
