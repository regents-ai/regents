        agents as the fleet's notebooks. Answers the file with its revision.
        The body is at most 24576 bytes.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
        - {$ref: "#/components/parameters/Project"}
        - {$ref: "#/components/parameters/NotebookId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotebookFileAddRequest"}
      responses:
        "200":
          description: The file added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotebookFileSaved"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "403": {$ref: "#/components/responses/NotebookChangeRefused"}
        "404": {$ref: "#/components/responses/NotebookFileNotFound"}
        "409": {$ref: "#/components/responses/NotebookFileConflict"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/NotebookFileRefused"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/NotebookFileUnavailable"}
        default: {$ref: "#/components/responses/SignInRefusal"}
  /api/v1/keyfleet/agent/fleets/{fleet_id}/projects/{project}/notebooks/{notebook_id}/files/write:
    post:
      x-pairing-required: true
      operationId: writeNotebookFile
      description: >-
        Replaces the whole text of a file the signing agent added to the notebook's files, or of any
        file of a notebook its creator unlocked or of the scratchpad of a Key the agent acts as.
        Writing notebook.py saves a new version of the notebook's code. Anyone else's file answers
        notebooks_maker_only and changes nothing: add a file of your own instead.
        expected_revision is the revision the file was read at: a file changed since answers 409
        stale_revision with its revision now, and nothing is written. Read it again, merge your
        change into what it holds now, and write with that revision.
        Only an active project's notebooks change. Open to the same agents as the fleet's
        notebooks. Answers the file with its new revision. The body is at most
        24576 bytes.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
        - {$ref: "#/components/parameters/Project"}
        - {$ref: "#/components/parameters/NotebookId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotebookFileWriteRequest"}
      responses:
        "200":
          description: The file written
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotebookFileSaved"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "403": {$ref: "#/components/responses/NotebookChangeRefused"}
        "404": {$ref: "#/components/responses/NotebookFileNotFound"}
        "409": {$ref: "#/components/responses/NotebookFileWriteConflict"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/NotebookFileRefused"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/NotebookFileUnavailable"}
        default: {$ref: "#/components/responses/SignInRefusal"}
