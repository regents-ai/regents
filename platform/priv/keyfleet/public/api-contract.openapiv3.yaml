        send it. It can't be undone: the Key then never gets traits, and the draws' coordinator is
        free to be changed again. Blocked "From TIME" until the 24 hours are up, "No draw waiting"
        while no request waits, "Traits drawn" once the draw is made, "Wait ended: it never gets
        traits" once the wait was ended, and "Its number gives its traits" for a Key dealt its card
        by number. Nothing is sent here: the signing wallet sends it itself, on Base.
