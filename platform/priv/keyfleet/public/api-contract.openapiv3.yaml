      operationId: buildEndShard
      description: >-
        For each of the Key's active shards, the transaction that ends it now and the one that
        renews it for 30 days, as a Key page's shard list does: end-WALLET and renew-WALLET. The
        Key's holder may end or renew any of them; a shard's own wallet may end only its own.
        Blocked "Already ended" for a shard the chain has ended, and "Not your Key" for a step the
        signing wallet may not send. Nothing is sent here: the signing wallet sends them itself, on
        Base.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
        - {$ref: "#/components/parameters/TokenId"}
      requestBody: {$ref: "#/components/requestBodies/AgentEmpty"}
