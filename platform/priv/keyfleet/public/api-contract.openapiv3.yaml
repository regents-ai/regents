      description: >-
        Submits a task for review in one write, at the version the caller last read: the task is
        marked done, result_ref becomes its result, and each evidence
        item is linked as something the task produces. Its sys.submitted records who submitted it,
        the task version the submission made, and the evidence. A submission only claims the work
        is done; whether it is accepted is for other members' reviews, and neither says anything
        about paying for it. Only the Key that created the task, or a Key that joined it, submits it. Submitting again
        replaces the submission, and the new version waits for review again.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspaceSubmitRequest"}
