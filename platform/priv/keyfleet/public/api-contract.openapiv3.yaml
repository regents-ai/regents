      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
        - {$ref: "#/components/parameters/Project"}
        - {$ref: "#/components/parameters/NotebookId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotebookFilesListRequest"}
      responses:
        "200":
          description: A page of the folder's entries
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotebookFileList"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "403": {$ref: "#/components/responses/NotebookNotOpen"}
        "404": {$ref: "#/components/responses/NotebookFileNotFound"}
        "409": {$ref: "#/components/responses/ProjectArchived"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422":
          description: >-
            Told only once the request's signature verified. notebook_cursor_unknown: the cursor
