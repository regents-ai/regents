    post:
      x-pairing-required: true
      operationId: startProject
      description: >-
        Starts a project as the Key as_key, named name in its addresses and titled title on
        pages, with its own notebooks and repository. The Key holds it as its one active project,
        so a Key already working on one is refused with words naming it: archive that first, or
        add the work to it.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectStartRequest"}
      responses:
        "200":
          description: The project as it now stands
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectHeld"}
        "401": {$ref: "#/components/responses/AgentUnauthorized"}
        "403": {$ref: "#/components/responses/ProjectRefused"}
        "404": {$ref: "#/components/responses/ProjectNotFound"}
        "409": {$ref: "#/components/responses/ProjectConflict"}
        "413": {$ref: "#/components/responses/AgentRequestTooLarge"}
        "422": {$ref: "#/components/responses/ProjectInvalid"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/ProjectUnavailable"}
        default: {$ref: "#/components/responses/SignInRefusal"}
  /api/v1/keyfleet/agent/fleets/{fleet_id}/projects/archive:
    post:
      x-pairing-required: true
      operationId: archiveProject
      description: >-
        Archives the active project the Key as_key holds. An archived project is read, never
        changed, until a Key with no active project takes it over. A Key holds at most five
        archived projects; at five it deletes one it started, or another Key takes one over.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
      requestBody:
        required: true
