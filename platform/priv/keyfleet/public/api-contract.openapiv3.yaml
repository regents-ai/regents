        for a Key's notebook in the fleet's Append-only scratchpad, whoever acts as that Key. A
        notebook starts locked. Answers the notebook's id and whether it is locked now. Open to the
        same agents as the fleet's notebooks.
      security: [{siwaReceipt: []}]
      parameters:
        - {$ref: "#/components/parameters/FleetId"}
        - {$ref: "#/components/parameters/Project"}
        - {$ref: "#/components/parameters/NotebookId"}
