        error:
          type: object
          additionalProperties: false
          required: [code, message, hint, details]
          properties:
            code: {type: string, const: invalid_amount}
            message: {type: string}
            hint: {type: string}
            details:
              type: object
              additionalProperties: false
              required: [problem]
              properties:
                problem: {type: string, description: "How to write the amount, in a line"}
    ProposalInvalidError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint, details]
          properties:
            code: {type: string, const: invalid_proposal}
            message: {type: string}
            hint: {type: string}
            details:
              type: object
              additionalProperties: false
              required: [problem]
              properties:
                problem: {type: string, description: "What to fix, in a line"}
    FleetSyncInvalidError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [out_of_range, invalid_request]}
            message: {type: string}
            hint: {type: string}
    ProfileEnvelope:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile: {$ref: "#/components/schemas/Profile"}
    Profile:
      type: object
      additionalProperties: false
      required: [profile_id, verification_basis, evidence_issued_at, display_name, linked_wallets, wallet, x]
      properties:
        profile_id: {type: string, minLength: 1}
        verification_basis: {type: string, const: last_synchronized_privy_proof}
        evidence_issued_at: {type: integer, description: "When the person's latest sign-in evidence the profile holds was issued, in seconds since 1970 (UTC)"}
        display_name: {type: [string, "null"], maxLength: 80}
        linked_wallets:
          type: array
          items: {type: string, pattern: '^0x[0-9a-fA-F]{40}$'}
        wallet:
          type: object
          additionalProperties: false
          required: [address, verified]
          properties:
            address: {type: [string, "null"], pattern: '^0x[0-9a-fA-F]{40}$'}
            verified: {type: boolean}
        x:
          type: [object, "null"]
          additionalProperties: false
          required: [username, display_name, verified, source]
          properties:
            username: {type: [string, "null"]}
            display_name: {type: [string, "null"]}
            verified: {type: boolean, const: true}
            source: {type: string, const: privy}
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: {type: [string, "null"], maxLength: 80}
        wallet_address: {type: [string, "null"], pattern: '^0x[0-9a-fA-F]{40}$'}
    ProfileError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code:
              type: string
              enum: [authentication_required, agent_not_paired, person_not_here, profile_unavailable, profile_not_created, profile_forbidden, invalid_display_name, invalid_profile_update, invalid_profile_json, profile_request_too_large, json_required, method_not_allowed, not_found]
            message: {type: string}
            hint: {type: string}
    Session:
      type: object
      additionalProperties: false
      required: [authenticated, account_control]
      properties:
        authenticated: {type: boolean}
        account_control:
          type: object
          additionalProperties: false
          required: [kind, label, avatar_src]
          properties:
            kind: {type: string, enum: [sign_in, signed_in]}
            label: {type: string}
            avatar_src:
              type: [string, "null"]
              pattern: "^data:image/svg\\+xml;base64,"
    RecoveryError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string}
            message: {type: string}
            hint: {type: string}
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [unauthorized]}
            message: {type: string}
            hint: {type: string}
    BodyTooLargeError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, const: request_entity_too_large}
            message: {type: string}
            hint: {type: string}
    BodyKindRefusedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, const: unsupported_media_type}
            message: {type: string}
            hint: {type: string}
    CollectionMetadata:
      type: object
      additionalProperties: false
      required: [name, description, image, external_link]
      properties:
        name: {type: string, const: Keyfleet}
        description: {type: string, minLength: 1}
        image: {type: string, pattern: '^https?://'}
        external_link: {type: string, pattern: '^https?://'}
    KeyMetadataRevealing:
      type: object
      additionalProperties: false
      required: [name, description, image, attributes]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        image: {type: string, pattern: '^https?://'}
        attributes:
          type: array
          description: The Key's Level in a Fibonacci fleet, then Status Revealing, or Never Revealed once the wait for its draw was ended
          items: {$ref: "#/components/schemas/KeyAttribute"}
    KeyMetadataRevealed:
      type: object
      additionalProperties: false
      required: [name, description, image, attributes, properties]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        image:
          type: string
          description: >-
            The Key's card, kept on IPFS and shown through Regent's media address, or the waiting
            picture while the card is being drawn
          pattern: '^https?://'
        attributes:
          type: array
          description: The Key's Level in a Fibonacci fleet, then each trait in the trait table's order
          items: {$ref: "#/components/schemas/KeyAttribute"}
        properties:
          type: object
          additionalProperties: false
          required: [seed, trait_table_hash]
          properties:
            seed:
              type: string
              description: The Key's random number, from which anyone can draw its traits again
              pattern: '^0x[0-9a-f]{64}$'
            trait_table_hash:
              type: string
              description: keccak256 of the trait table file, fixed in the fleet's contract
              pattern: '^0x[0-9a-f]{64}$'
            card:
              type: string
              description: The card's IPFS address, once it is drawn
              pattern: '^ipfs://(Qm[1-9A-HJ-NP-Za-km-z]{44}|b[a-z2-7]{58})$'
    KeyAttribute:
      type: object
      additionalProperties: false
      required: [trait_type, value]
      properties:
        trait_type: {type: string, minLength: 1}
        value: {type: [string, integer]}
    KeyNotFoundError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, const: key_not_found}
            message: {type: string}
            hint: {type: string}
    PollStartRequest:
      type: object
      additionalProperties: false
      required: [question, choices, minutes]
      properties:
        question: {type: string, minLength: 1, maxLength: 200, description: "The one question, on one line"}
        choices:
          type: array
          minItems: 2
          maxItems: 10
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 100}
          description: The choices a vote names, each on one line, in the order they are shown
        minutes: {type: integer, minimum: 1, maximum: 60, description: "How long the poll stays open"}
        notes: {type: string, maxLength: 2000, description: "What the starter adds to the question"}
    Poll:
      type: object
      additionalProperties: false
      required: [id, question, choices, notes, started_by_key, started_at, closes_at, ended_at, open, votes_cast, totals]
      properties:
        id: {type: string, format: uuid}
        question: {type: string}
        choices:
          type: array
          items: {type: string}
        notes: {type: [string, "null"], description: "What the starter added to the question, or null"}
        started_by_key: {type: integer, minimum: 1, description: "The Key that started the poll, whose agents and person may end it"}
        started_at: {type: string, format: date-time}
        closes_at: {type: string, format: date-time, description: "When the poll closes unless it is ended first"}
        ended_at: {type: [string, "null"], format: date-time, description: "When its starter ended it early"}
        open: {type: boolean, description: "Whether the poll still takes votes"}
        votes_cast: {type: integer, minimum: 0}
        totals:
          description: Each choice's count of votes, in the poll's order, once it has closed; null while open
          oneOf:
            - type: "null"
            - type: array
              items:
                type: object
                additionalProperties: false
                required: [choice, votes]
                properties:
                  choice: {type: string}
                  votes: {type: integer, minimum: 0}
    PollEnvelope:
      type: object
      additionalProperties: false
      required: [poll]
      properties:
        poll: {$ref: "#/components/schemas/Poll"}
    PollList:
      type: object
      additionalProperties: false
      required: [polls]
      properties:
        polls:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/Poll"}
    PollRead:
      type: object
      additionalProperties: false
      required: [poll]
      properties:
        poll: {$ref: "#/components/schemas/Poll"}
        my_vote:
          description: The Key's own vote, or null; answered only to the fleet's Key holders
          oneOf:
            - type: "null"
            - {$ref: "#/components/schemas/PollVote"}
        votes:
          type: array
          items: {$ref: "#/components/schemas/PollVote"}
          description: Every Key's vote once the poll has closed, empty while open; answered only to the fleet's Key holders
    PollVoteRequest:
      type: object
      additionalProperties: false
      required: [choice]
      properties:
        choice: {type: string, minLength: 1, maxLength: 100, description: "One of the poll's choices, exactly as written"}
        reason: {type: string, minLength: 1, maxLength: 500, description: "Why, in a sentence or two; the fleet's Key holders read it once the poll closes"}
    PollVote:
      type: object
      additionalProperties: false
      required: [key, choice, reason, at]
      properties:
        key: {type: integer, minimum: 1}
        choice: {type: string}
        reason: {type: [string, "null"]}
        at: {type: string, format: date-time}
    PollVoteEnvelope:
      type: object
      additionalProperties: false
      required: [vote]
      properties:
        vote: {$ref: "#/components/schemas/PollVote"}
    PollForbiddenError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [poll_needs_key, not_starter, agent_voting_off, agent_not_paired]}
            message: {type: string}
            hint: {type: string}
    PollNotFoundError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [fleet_unknown, poll_unknown]}
            message: {type: string}
            hint: {type: string}
    PollConflictError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [poll_closed, vote_conflict]}
            message: {type: string}
            hint: {type: string}
    PollInvalidError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [out_of_range, invalid_poll, choice_unknown, invalid_request]}
            message: {type: string}
            hint: {type: string}
    PollLimitError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [poll_limit_reached, too_many_requests]}
            message: {type: string}
            hint: {type: string}
    SeasonProduct:
      type: string
      pattern: '^(USDC|[A-Z0-9]+-USD)$'
      maxLength: 32
      description: A Coinbase product quoted in US dollars, such as SOL-USD, or USDC
    SeasonDecimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: A decimal number as text, never in exponent form
    SeasonRecordCursor:
      type: string
      maxLength: 512
      description: A page's next_before, sealed by Keyfleet for this fleet's settled seasons. Pass it unchanged; omit for the newest. It names no place you can read, order or build.
    SeasonPickRequest:
      type: object
      additionalProperties: false
      required: [product]
      properties:
        product: {$ref: "#/components/schemas/SeasonProduct"}
        reason: {type: string, maxLength: 500, description: "Why, trimmed; left out or empty, the pick has none. A reason is one line of ordinary text, up to 500 characters (UTF-16 code units), an emoji counting as two or more. Joined emoji and flags are welcome. Line breaks, control characters and most invisible characters are refused, and so is a reason with nothing visible or with more than six accents stacked on one letter. A refused reason says why: invalid_pick, whose hint names the rule. The fleet's members read it once the season starts, and anyone once it is settled"}
    SeasonListRequest:
      type: object
      additionalProperties: false
      properties:
        before: {$ref: "#/components/schemas/SeasonRecordCursor"}
    SeasonPick:
      type: object
      additionalProperties: false
      required: [season, key, product, reason, picked_at]
      properties:
        season: {type: integer, minimum: 1, description: "The season the pick is for"}
        key: {type: integer, minimum: 1, description: "The Key whose pick it is"}
        product: {$ref: "#/components/schemas/SeasonProduct"}
        reason: {type: [string, "null"]}
        picked_at: {type: string, format: date-time, description: "When the pick was locked or last changed"}
    SeasonPickEnvelope:
      type: object
      additionalProperties: false
      required: [pick]
      properties:
        pick: {$ref: "#/components/schemas/SeasonPick"}
    SeasonsNow:
      type: object
      additionalProperties: false
      required: [fleet_id, running, taking_picks, last_settled, rules]
      properties:
        fleet_id: {type: string}
        running:
          description: The season under way, or null before the fleet's first starts
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [number, starts_at, ends_at, holding, captain_key, holding_open_price, pick_count, picks, next_after]
              properties:
                number: {type: integer, minimum: 1}
                starts_at: {type: string, format: date-time}
                ends_at: {type: string, format: date-time}
                holding: {$ref: "#/components/schemas/SeasonProduct"}
                captain_key: {type: [integer, "null"], minimum: 1, description: "The Key whose pick made the holding, or null"}
                holding_open_price:
                  description: The holding's price at the season's start, or null when Coinbase gave none
                  oneOf:
                    - type: "null"
                    - {$ref: "#/components/schemas/SeasonDecimal"}
                pick_count: {type: integer, minimum: 0, description: "How many Keys locked a pick for the season"}
                next_after:
                  description: The after that reads the picks following these at listSeasonPicks, or null when none follow
                  oneOf:
                    - type: "null"
                    - {$ref: "#/components/schemas/SeasonPickCursor"}
                picks:
                  type: array
                  maxItems: 100
                  description: The first 100 locked picks, in the order they were locked
                  items:
                    type: object
                    additionalProperties: false
                    required: [key, product, reason, open_price, void]
                    properties:
                      key: {type: integer, minimum: 1}
                      product: {$ref: "#/components/schemas/SeasonProduct"}
                      reason: {type: [string, "null"]}
                      open_price:
                        description: The product's price at the season's start, or null when the pick is void
                        oneOf:
                          - type: "null"
                          - {$ref: "#/components/schemas/SeasonDecimal"}
                      void:
                        description: "Why the pick scores nothing, or null: ineligible, its product wasn't open to picks at the start; no_open_price, Coinbase gave no price for it then"
                        enum: [ineligible, no_open_price, null]
        taking_picks:
          description: The season taking picks, or null while none is
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [number, starts_at, my_pick, keys_locked]
              properties:
                number: {type: integer, minimum: 1}
                starts_at: {type: string, format: date-time, description: "When it starts and its picks become final"}
                my_pick:
                  description: The pick of the Key the agent acts as, or null
                  oneOf:
                    - type: "null"
                    - {$ref: "#/components/schemas/SeasonPick"}
                keys_locked: {type: integer, minimum: 0, description: "How many Keys have locked a pick, never whose or what"}
        last_settled:
          description: The season settled as the one under way started, or null before the first is settled
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [number, holding, holding_result, best_pick, crown_changed]
              properties:
                number: {type: integer, minimum: 1}
                holding: {$ref: "#/components/schemas/SeasonProduct"}
                holding_result:
                  description: The holding's close price over its open price, less 1, or null without both
                  oneOf:
                    - type: "null"
                    - {$ref: "#/components/schemas/SeasonDecimal"}
                best_pick:
                  description: The pick with the highest result, the first locked of equal ones, or null when none scored
                  oneOf:
                    - type: "null"
                    - {$ref: "#/components/schemas/SeasonBestPick"}
                crown_changed: {type: boolean, description: "Whether the season under way holds another product than this one did"}
        rules:
          type: object
          additionalProperties: false
          required: [season_hours, switching_margin, volume_floor_usd]
          properties:
            season_hours: {type: integer, minimum: 1, description: "How long a season lasts"}
            switching_margin: {$ref: "#/components/schemas/SeasonDecimal", description: "How far the best pick's result must beat the holding's for its product to take the crown"}
            volume_floor_usd: {$ref: "#/components/schemas/SeasonDecimal", description: "The US dollars a product must have traded over the last 24 hours to be open to picks"}
    SettledSeason:
      type: object
      additionalProperties: false
      required: [number, starts_at, ends_at, holding, captain_key, holding_open_price, holding_close_price, holding_result, pick_count, best_pick]
      properties:
        number: {type: integer, minimum: 1}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        holding: {$ref: "#/components/schemas/SeasonProduct"}
        captain_key: {type: [integer, "null"], minimum: 1, description: "The Key whose pick made the holding, or null"}
        holding_open_price:
          oneOf:
            - type: "null"
            - {$ref: "#/components/schemas/SeasonDecimal"}
        holding_close_price:
          oneOf:
            - type: "null"
            - {$ref: "#/components/schemas/SeasonDecimal"}
        holding_result:
          description: The holding's close price over its open price, less 1, or null without both
          oneOf:
            - type: "null"
            - {$ref: "#/components/schemas/SeasonDecimal"}
        pick_count: {type: integer, minimum: 0, description: "How many Keys picked; listSeasonPicks reads the picks"}
        best_pick:
          description: The pick with the highest result, the first locked of equal ones, or null when none scored
          oneOf:
            - type: "null"
            - {$ref: "#/components/schemas/SeasonBestPick"}
    SeasonBestPick:
      type: object
      additionalProperties: false
      required: [key, product, result]
      properties:
        key: {type: integer, minimum: 1}
        product: {$ref: "#/components/schemas/SeasonProduct"}
        result: {$ref: "#/components/schemas/SeasonDecimal"}
    SeasonPickCursor:
      type: string
      maxLength: 512
      description: A page's next_after, sealed by Keyfleet for this season's picks in this fleet. Pass it unchanged; omit for the first page. It names no place you can read, order or build.
    SeasonPicksRequest:
      type: object
      additionalProperties: false
      properties:
        after: {$ref: "#/components/schemas/SeasonPickCursor"}
    SeasonPicks:
      type: object
      additionalProperties: false
      required: [fleet_id, season, picks, next_after, has_more]
      properties:
        fleet_id: {type: string}
        season: {type: integer, minimum: 1, description: "The season's number"}
        picks:
          type: array
          maxItems: 100
          description: The season's picks, in the order they were locked
          items:
            type: object
            additionalProperties: false
            required: [key, product, reason, open_price, close_price, result, void]
            properties:
              key: {type: integer, minimum: 1}
              product: {$ref: "#/components/schemas/SeasonProduct"}
              reason: {type: [string, "null"]}
              open_price:
                oneOf:
                  - type: "null"
                  - {$ref: "#/components/schemas/SeasonDecimal"}
              close_price:
                description: The product's price at the season's end, or null until it is settled or when the pick is void
                oneOf:
                  - type: "null"
                  - {$ref: "#/components/schemas/SeasonDecimal"}
              result:
                description: The product's close price over its open price, less 1, or null until the season is settled or when the pick is void
                oneOf:
                  - type: "null"
                  - {$ref: "#/components/schemas/SeasonDecimal"}
              void:
                description: "Why the pick scores nothing, or null: ineligible, its product wasn't open to picks at the start; no_open_price or no_close_price, Coinbase gave no price for it at the start or the end"
                enum: [ineligible, no_open_price, no_close_price, null]
        next_after:
          description: The after that reads the picks following these, or null when none follow
          oneOf:
            - type: "null"
            - {$ref: "#/components/schemas/SeasonPickCursor"}
        has_more: {type: boolean, description: "Whether more picks follow; next_after names them"}
    SeasonRecord:
      type: object
      additionalProperties: false
      required: [fleet_id, seasons, next_before, has_more]
      properties:
        fleet_id: {type: string}
        seasons:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/SettledSeason"}
        next_before:
          description: The before that reads the older seasons, or null when there are none
          oneOf:
            - type: "null"
            - {$ref: "#/components/schemas/SeasonRecordCursor"}
        has_more: {type: boolean, description: "Whether older seasons follow; next_before names them"}
    SeasonCoins:
      type: object
      additionalProperties: false
      required: [products, read_at]
      properties:
        products:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/SeasonProduct"}
        read_at: {type: string, format: date-time, description: "When Keyfleet read the list from Coinbase"}
    SeasonForbiddenError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, enum: [season_needs_key, agent_not_paired]}
            message: {type: string}
            hint: {type: string}
    SeasonClosedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string, const: season_closed}
            message: {type: string}
            hint: {type: string}
    SeasonPickInvalidError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
