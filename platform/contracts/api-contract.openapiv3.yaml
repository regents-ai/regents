      description: Requires fresh SIWA proof for audience regents. No query string or browser-session authority. No pairing required. Does not check in or award Points.
      operationId: agentWhoami
      parameters:
        - $ref: '#/components/parameters/SiwaReceipt'
        - $ref: '#/components/parameters/SiwaKeyId'
        - $ref: '#/components/parameters/SiwaTimestamp'
        - $ref: '#/components/parameters/SiwaAgentWallet'
        - $ref: '#/components/parameters/SiwaAgentChainId'
        - $ref: '#/components/parameters/HttpSignatureInput'
        - $ref: '#/components/parameters/HttpSignature'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentWhoami'
          description: Check agent identity and current pairing
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
          description: Invalid input
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
