      x-pairing-required: false
  /api/agents/v1/pair:
    post:
      operationId: pairAgent
      summary: Pair this agent with a person's account
      description: >-
        Joins the signing agent to the Regents account that issued the one-time
        pairing code. Sign the request with your SIWA key for the audience
        regents. A code works once and expires ten minutes after it was made.
      security: []
      parameters:
        - {$ref: "#/components/parameters/SiwaReceipt"}
        - {$ref: "#/components/parameters/SiwaKeyId"}
        - {$ref: "#/components/parameters/SiwaTimestamp"}
        - {$ref: "#/components/parameters/SiwaAgentWallet"}
        - {$ref: "#/components/parameters/SiwaAgentChainId"}
        - {$ref: "#/components/parameters/HttpSignatureInput"}
        - {$ref: "#/components/parameters/HttpSignature"}
        - {$ref: "#/components/parameters/ContentDigest"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name, harness]
              properties:
                code: {type: string, minLength: 1, maxLength: 128}
                name: {type: string, minLength: 1, maxLength: 80}
                harness: {$ref: "#/components/schemas/AgentHarness"}
      responses:
        "201":
          description: The agent is paired with the account that issued the code
          headers:
            RateLimit: {$ref: "#/components/headers/RateLimit"}
            RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PairedAgentEnvelope"}
        "400": {$ref: "#/components/responses/AgentPairingFailed"}
        "401": {$ref: "#/components/responses/AgentVerificationFailed"}
        "409": {$ref: "#/components/responses/AgentPairConflict"}
        "429": {$ref: "#/components/responses/AgentRateLimited"}
        "503": {$ref: "#/components/responses/AgentVerificationUnavailable"}
        default: {$ref: "#/components/responses/AgentSignInRefused"}
  /api/agents/v1/me:
    get:
      operationId: checkInAgent
      summary: Check in as a paired agent
      description: >-
        Records this request as the agent's latest contact, which its person
        sees on their Account page, and returns the paired agent with the
        names of the account it is paired with. Sign the request with your
        SIWA key; it has no body.
      security: []
      parameters:
        - {$ref: "#/components/parameters/SiwaReceipt"}
        - {$ref: "#/components/parameters/SiwaKeyId"}
        - {$ref: "#/components/parameters/SiwaTimestamp"}
        - {$ref: "#/components/parameters/SiwaAgentWallet"}
        - {$ref: "#/components/parameters/SiwaAgentChainId"}
        - {$ref: "#/components/parameters/HttpSignatureInput"}
        - {$ref: "#/components/parameters/HttpSignature"}
      responses:
        "200":
          description: The paired agent, with this check-in recorded as its latest contact
          headers:
            RateLimit: {$ref: "#/components/headers/RateLimit"}
            RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckedInAgentEnvelope"}
        "401": {$ref: "#/components/responses/AgentVerificationFailed"}
        "404": {$ref: "#/components/responses/AgentNotPaired"}
        "409": {$ref: "#/components/responses/AgentRequestReplayed"}
        "429": {$ref: "#/components/responses/AgentRateLimited"}
        "503": {$ref: "#/components/responses/AgentVerificationUnavailable"}
        default: {$ref: "#/components/responses/AgentSignInRefused"}
  /auth/csrf:
    get:
      operationId: getBrowserCsrf
      responses:
        "200":
          description: CSRF token for browser session changes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [csrf_token]
                properties:
                  csrf_token: {type: string, minLength: 1}
        "429":
          description: Too many new browser sessions were started from the client address
          headers:
            Retry-After: {schema: {type: string, const: "300"}}
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecoveryError"}
              examples:
                rateLimited:
                  value: {error: {code: rate_limited, message: "Too many new sign-ins came from this address.", hint: "Wait the number of seconds in Retry-After, then try again."}}
        "409": {$ref: "#/components/responses/SessionChanged"}
  /auth/privy/failure:
    post:
      operationId: reportPrivyBrowserFailure
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [bridge_startup, flow_closed, invalid_message, provider_error, request_timeout, session_exchange, unable_to_sign]
      responses:
        "204": {description: Diagnostic accepted or safely ignored}
        "403": {$ref: "#/components/responses/CsrfForbidden"}
  /auth/privy/session:
    post:
      operationId: createPrivyBrowserSession
      security: [{privyAccessToken: [], privyIdentityToken: [], csrfToken: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, maxProperties: 0, additionalProperties: false}
      responses:
        "200": {$ref: "#/components/responses/Session"}
        "403": {$ref: "#/components/responses/CsrfForbidden"}
        "401": {$ref: "#/components/responses/PrivySessionUnauthorized"}
        "409": {$ref: "#/components/responses/SessionChanged"}
    delete:
      operationId: deletePrivyBrowserSession
      security: [{csrfToken: []}]
      responses:
        "200": {$ref: "#/components/responses/Logout"}
        "403": {$ref: "#/components/responses/CsrfForbidden"}
  /auth/session:
    get:
      operationId: getBrowserSession
      responses:
        "200": {$ref: "#/components/responses/Session"}
components:
  headers:
    RateLimit:
      description: >-
        What is left of the budget this request counted against, as
        "policy";r=remaining;t=seconds until the window resets.
      schema: {type: string}
    RateLimitPolicy:
      description: >-
        The budget this request counted against, as "policy";q=requests;w=window
        seconds. Pairing allows 10 requests and check-ins 60 per client address
        per minute.
      schema: {type: string}
    RetryAfter:
      description: Seconds to wait before the budget resets.
      schema: {type: integer, minimum: 1}
  parameters:
    SiwaReceipt:
      name: x-siwa-receipt
      in: header
      required: true
      schema: {type: string, minLength: 1}
    SiwaKeyId:
      name: x-key-id
      in: header
      required: true
      schema: {type: string, minLength: 1}
    SiwaTimestamp:
      name: x-timestamp
      in: header
      required: true
      schema: {type: string, pattern: '^\d+$'}
    SiwaAgentWallet:
      name: x-agent-wallet-address
      in: header
      required: true
      schema: {type: string, pattern: '^0x[0-9a-fA-F]{40}$'}
    SiwaAgentChainId:
      name: x-agent-chain-id
      in: header
      required: true
      schema: {type: string, const: "8453"}
    HttpSignatureInput:
      name: x-siwa-signature-input
      in: header
      required: true
      schema: {type: string, minLength: 1}
    HttpSignature:
      name: x-siwa-signature
      in: header
      required: true
      schema: {type: string, minLength: 1}
    ContentDigest:
      name: content-digest
      in: header
      required: true
      schema: {type: string, minLength: 1}
  securitySchemes:
    privyAccessToken:
      type: http
      scheme: bearer
      bearerFormat: Privy access token
    privyIdentityToken: {type: apiKey, in: header, name: privy-id-token}
    csrfToken: {type: apiKey, in: header, name: x-csrf-token}
  responses:
    Session:
      description: Current browser session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Session"
    PrivySessionUnauthorized:
      description: The Privy access and identity tokens were not both present and valid for one signed-in session
      headers:
        x-ash-provider-relogin:
          description: Present only when the access token itself could not be verified, which permits one fresh provider login
          required: false
          schema: {type: string, const: allowed}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RecoveryError"}
          examples:
            unauthorized:
              value: {error: {code: unauthorized, message: "This sign-in couldn't be confirmed.", hint: "Sign in again."}}
    SessionChanged:
      description: This browser's session changed in another tab or ended; reload the page
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RecoveryError"}
          examples:
            superseded:
              value: {error: {code: session_superseded, message: "This browser was signed in again from another tab.", hint: "Reload the page."}}
            reset:
              value: {error: {code: session_reset_required, message: "This browser's sign-in has ended.", hint: "Reload the page, then sign in again."}}
            switched:
              value: {error: {code: account_switch_required, message: "This browser was signed in to another account.", hint: "Reload the page, then sign in again."}}
    Logout:
      description: Local browser session removed
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok]
            properties: {ok: {type: boolean, const: true}}
    CsrfForbidden:
      description: CSRF token was absent or invalid
    AgentNotPaired:
      description: The signing agent is not paired with an account
      headers:
        RateLimit: {$ref: "#/components/headers/RateLimit"}
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AgentPairingError"}
          examples:
            notPaired:
              value: {error: {code: not_paired, message: "This agent is not paired with an account.", hint: "Ask your person for a pairing code, then pair again."}}
    AgentPairingFailed:
      description: The pairing code could not be claimed, or the runtime is not on the list
      headers:
        RateLimit: {$ref: "#/components/headers/RateLimit"}
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AgentPairingError"}
          examples:
            pairingFailed:
              value: {error: {code: pairing_failed, message: "The pairing code could not be used.", hint: "Ask your person for a new pairing code. Each code works once and expires ten minutes after it was made."}}
            harnessUnknown:
              value: {error: {code: harness_unknown, message: "That harness is not one we know.", hint: "Send one of: hermes, grok_bot, muse, openclaw, nemoclaw, ironclaw, pi, claude_code, codex, cursor, gemini_cli, dots, other. Send other if yours is not listed."}}
    AgentVerificationFailed:
      description: >-
        The sign-in service did not verify the signed agent request. The answer
        is verification_failed; duplicate_proof, unsupported_query or
        missing_signed_body when a signature header repeats, a query string is
        sent or the body was not captured whole; or the sign-in service's own
        refusal, whose message and hint say what went wrong and what to do next
      headers:
        RateLimit: {$ref: "#/components/headers/RateLimit"}
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AgentPairingError"}
          examples:
            verificationFailed:
              value: {error: {code: verification_failed, message: "The signed agent request could not be verified.", hint: "Sign the request with your agent key as https://siwa.regents.sh/skill.md describes, then send it again."}}
            headersMissing:
              value: {error: {code: http_headers_missing, message: "missing required signed agent headers", hint: "The request's signature headers are missing, too old or malformed. Send it with `uv run siwa_agent.py request METHOD URL`, which signs each request fresh, just before sending. Each signature works once, for two minutes."}}
    AgentRequestReplayed:
      description: The sign-in service has already verified this exact signed request once
      headers:
        RateLimit: {$ref: "#/components/headers/RateLimit"}
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AgentPairingError"}
          examples:
            requestReplayed:
              value: {error: {code: request_replayed, message: "request replay detected", hint: "That signed request was already used; each one works once. Run `request` again to sign it fresh, and never resend saved signature headers."}}
    AgentPairConflict:
      description: >-
        The sign-in service has already verified this exact signed request once,
        or the person's account already has 100 paired agents
      headers:
        RateLimit: {$ref: "#/components/headers/RateLimit"}
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AgentPairingError"}
          examples:
            requestReplayed:
              value: {error: {code: request_replayed, message: "request replay detected", hint: "That signed request was already used; each one works once. Run `request` again to sign it fresh, and never resend saved signature headers."}}
            agentLimit:
              value: {error: {code: agent_limit, message: "This account already has 100 paired agents.", hint: "Ask your person to unpair an agent on their Regents account page, then pair again. The same code works until it expires."}}
    AgentVerificationUnavailable:
      description: The sign-in service could not be reached to verify the request
      headers:
        RateLimit: {$ref: "#/components/headers/RateLimit"}
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AgentPairingError"}
          examples:
            verificationUnavailable:
              value: {error: {code: siwa_request_failed, message: "The sign-in service could not be reached.", hint: "Try again in a minute."}}
    AgentSignInRefused:
      description: >-
        Another refusal from the sign-in service, passed on unchanged: its
        status, code, message, and a hint written for this site and the
        agent's signing tool
      headers:
        RateLimit: {$ref: "#/components/headers/RateLimit"}
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AgentPairingError"}
    AgentRateLimited:
      description: Too many requests were received from the client address
      headers:
        RateLimit: {$ref: "#/components/headers/RateLimit"}
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AgentPairingError"}
          examples:
            rateLimited:
              value: {error: {code: rate_limited, message: "Too many requests.", hint: "Wait the number of seconds in Retry-After, then try again."}}
