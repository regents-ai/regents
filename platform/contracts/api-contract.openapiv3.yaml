    PairedAgentEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/PairedAgent"}
    PairedAgent:
      type: object
      additionalProperties: false
      required: [name, harness, wallet, paired_at, last_contact_at, registry_listing, human_backed, same_person_agent_count]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        harness: {$ref: "#/components/schemas/AgentHarness"}
        wallet: {type: string, pattern: '^0x[0-9a-f]{40}$'}
        paired_at: {type: string, format: date-time}
        last_contact_at: {type: string, format: date-time}
        registry_listing:
          description: The agent's page in the agent registry, or null when it has no listing there.
          type: [string, "null"]
          format: uri
        human_backed:
          description: Whether a person verified with World ID stands behind the agent. Once true, it stays true, because the first person saved stays linked to the agent for good.
          type: boolean
        same_person_agent_count:
          description: >-
            How many agents, this one included, the same verified person stands
            behind, or null when no verified person stands behind the agent.
          type: [integer, "null"]
          minimum: 1
    CheckedInAgentEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/CheckedInAgent"}
    CheckedInAgent:
      type: object
      additionalProperties: false
      required: [name, harness, wallet, paired_at, last_contact_at, registry_listing, human_backed, same_person_agent_count, account]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        harness: {$ref: "#/components/schemas/AgentHarness"}
        wallet: {type: string, pattern: '^0x[0-9a-f]{40}$'}
        paired_at: {type: string, format: date-time}
        last_contact_at: {type: string, format: date-time}
        registry_listing:
          description: The agent's page in the agent registry, or null when it has no listing there.
          type: [string, "null"]
          format: uri
        human_backed:
          description: Whether a person verified with World ID stands behind the agent. Once true, it stays true, because the first person saved stays linked to the agent for good.
          type: boolean
        same_person_agent_count:
          description: >-
            How many agents, this one included, the same verified person stands
            behind, or null when no verified person stands behind the agent.
          type: [integer, "null"]
          minimum: 1
        account: {$ref: "#/components/schemas/PairedAccount"}
    PairedAccount:
      description: >-
        The names of the account an agent is paired with, as its person sees
        them on their Account page. Either is null until the person has one.
      type: object
      additionalProperties: false
      required: [display_name, ens_name]
      properties:
        display_name: {type: [string, "null"], maxLength: 80}
        ens_name: {type: [string, "null"]}
    AgentHarness:
      type: string
      enum: [hermes, grok_bot, muse, openclaw, nemoclaw, ironclaw, pi, claude_code, codex, cursor, gemini_cli, dots, other]
    AgentPairingError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code:
              type: string
              description: >-
                pairing_failed, harness_unknown, agent_limit, not_paired,
                verification_failed, duplicate_proof, unsupported_query,
                missing_signed_body, siwa_request_failed or rate_limited, or
                a code the sign-in service gave, which
                https://siwa.regents.sh/skill.md explains
            message: {type: string}
            hint: {type: string}
    Session:
      type: object
      additionalProperties: false
      required: [authenticated, account_control]
      properties:
        authenticated: {type: boolean}
        account_control:
          type: object
          additionalProperties: false
          required: [kind, label, profile_path, avatar_src]
          properties:
            kind: {type: string, enum: [sign_in, signed_in]}
            label: {type: string}
            profile_path: {type: [string, "null"]}
            avatar_src:
              type: [string, "null"]
              pattern: "^(https://|data:image/svg\\+xml;base64,)"
    RecoveryError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, hint]
          properties:
            code: {type: string}
            message: {type: string}
            hint: {type: string}
