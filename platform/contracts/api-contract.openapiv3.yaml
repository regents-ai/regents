openapi: 3.1.0
info:
  title: Regent API
  version: 2.0.0
paths:
  /capabilities:
    get: {"operationId":"getCapabilities","summary":"Read the manifest of browser and HTTP agent operations","security":[],"responses":{"200":{"description":"Public operation manifest with authentication and availability metadata","content":{"application/json":{"schema":{"type":"object","required":["audience","proof_headers","tools"],"properties":{"audience":{"type":"string"},"proof_headers":{"type":"array","items":{"type":"string"}},"tools":{"type":"array","items":{"type":"object"}}}}}}}}}
  /api/agent/v1/account:
    get:
      description: Requires fresh SIWA proof for audience regents. No query string or browser-session authority. Requires a current pairing and an owner account on Regents.
      operationId: agentAccount
      parameters:
        - $ref: '#/components/parameters/SiwaReceipt'
        - $ref: '#/components/parameters/SiwaKeyId'
        - $ref: '#/components/parameters/SiwaTimestamp'
        - $ref: '#/components/parameters/SiwaAgentWallet'
        - $ref: '#/components/parameters/SiwaAgentChainId'
        - $ref: '#/components/parameters/HttpSignatureInput'
        - $ref: '#/components/parameters/HttpSignature'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAccountRead'
          description: Read the paired account
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
          description: Invalid input
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
          description: Invalid or missing proof
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
          description: Missing current pairing or owner account
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
          description: Wallet required or proof replayed
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
          description: Request budget exceeded
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
          description: Service unavailable
      security: []
      summary: Read the paired account
      x-authentication: siwa_per_request
      x-pairing-required: true
