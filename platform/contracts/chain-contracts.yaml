version: 1
product: ash-platform
contracts:
  - id: base_mainnet_reviewed_evidence
    evidence_manifest: base-mainnet.json
    evidence_sha256: 02da74d5a6de47f76206c12c1eb976696e0f36ba2292b38f1428e2e9389c3d35
    chain_target: base-mainnet
    authority: evidence_only
    # `authority` names the pinned evidence source; the list below separately
    # records founder release authority.
    admitted_prepared_actions:
      - regent_revenue_staking.stake
      - regent_revenue_staking.unstake
      - regent_revenue_staking.claim_usdc
      - regent_revenue_staking.claim_regent
      - regent_revenue_staking.claim_and_restake_regent
      - animata_redeemer.approve_nft_collection
      - animata_redeemer.approve_exact_usdc
      - animata_redeemer.redeem
      - animata_redeemer.claim
    reviewed_action_evidence:
      - contract_id: regent_revenue_staking
        abi_path: abi/regent-revenue-staking.json
        abi_sha256: c8c5570f76f32b72e3bdb0a062fc97cb7f74aacadf03683d796b57a765f1ca23
        action_ids:
          - stake
          - unstake
          - claim_usdc
          - claim_regent
          - claim_and_restake_regent
      - contract_id: animata_redeemer
        abi_path: abi/animata-redeemer.json
        abi_sha256: c14a490d3feefbee76fd08e5f993d987e27388cb6c78f4643e2d8010c34766fd
        action_ids:
          - approve_nft_collection
          - approve_exact_usdc
          - redeem
          - claim
      - contract_id: multicall3
        contract_name: Multicall3
        target: canonical_multicall3
        address: "0xcA11bde05977b3631167028862bE2a173976CA11"
        source_url: "https://basescan.org/address/0xcA11bde05977b3631167028862bE2a173976CA11#code"
        runtime_keccak256: "0xd5c15df687b16f2ff992fc8d767b4216323184a2bbc6ee2f9c398c318e770891"
        runtime_sha256: 2756d7c52baee85cacb504f6ee1df7aad6809ac8d94a4a111d76991f90d36d6e
        runtime_bytes: 3808
        abi_path: abi/multicall3.json
        abi_sha256: 37abf10ee8402b89482af88b281653256b79eb6d96eb4599200c03f542d8689d
        address_provenance: >-
          Multicall3 is deployed at the same address on every chain that carries it, Base
          included. The runtime identity above was recorded at admission from a read-only
          eth_getCode pinned to Base block 50767245
          (0x164fba1ff76fe80adef28ad9780776f5cf56331279d7b852b4c1cfb61e26a0e6, requireCanonical),
          and is re-proved on every read before any answer of the aggregator's is believed.
          The frozen base-mainnet.json evidence file is not amended: this identity lives in
          module constants beside the reads that file does not carry.
        interface_note: >-
          aggregate3 is used here for reading only. It is declared payable and it is never a
          send target: no prepared action, envelope or confirmation path names this contract,
          and every use of it is an eth_call pinned to one block hash with requireCanonical.
          allowFailure is false on every sub-call, so a reverting sub-call reverts the whole
          aggregate rather than yielding a partial reading, and each sub-call names the account
          it reads about in its own arguments because msg.sender under the aggregator is the
          aggregator. Nothing else Multicall3 declares is derived or prepared.
        reads:
          - id: aggregate3
            signature: aggregate3((address,bool,bytes)[])
            selector: "0x82ad56cb"
        action_ids: []
    validation_command: mix test test/ash_platform/wallet_actions/manifest_test.exs
