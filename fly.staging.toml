app = "regents-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PORT = "4000"
  ASH_PLATFORM_DEPLOYMENT_ROLE = "staging"

[metrics]
  port = 4000
  path = "/metrics"

[http_service]
  internal_port = 4000
  force_https = true

# BEAM release + migrations OOM at Fly's 256MB default.
[[vm]]
  memory_mb = 1024

[[http_service.checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  protocol = "http"
  timeout = "2s"
