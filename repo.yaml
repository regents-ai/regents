name: regent-contracts
role: canonical_solidity_source
owns:
  - solidity_source
  - foundry_tests
  - deployment_scripts
  - verified_deployment_records
  - canonical_abis
  - chain_contract_manifest
  - contract_version_history
excluded:
  - http_cli_contracts
  - ash_resources
  - workflow_logic
  - ui
  - projection_workers
promotion_policy: >-
  Archived Autolaunch contracts are NOT auto-promoted. Each contract family
  moves here only through an explicit source-of-truth and deployment migration
  (founder decision 2026-08-04, regent-839.4).
