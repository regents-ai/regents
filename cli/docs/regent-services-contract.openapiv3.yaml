openapi: 3.1.0
info:
  title: Regent Shared Services Contract
  version: 0.1.0
  description: >
    Source-of-truth contract for shared Regent HTTP services. Shared identity
    routes own Regent account bootstrap. Shared SIWA routes own signed identity
    proof, request verification, health, metrics, contract discovery, and the
    internal keyring routes.
x-regent-capability:
  status: beta
  owner: shared-services
  money_path: true
  cli_surface: true
  mobile_surface: false
x-regent-rate-limits:
  retry_after_header: Retry-After
  tiers:
    public_unauthenticated: strict bootstrap limits before SIWA identity is proven
    verified_cli_signed_agent: higher allowance after SIWA receipt or HTTP signature verification
    internal_service: bounded by keyring HMAC credential
  cli_allowance_requires_verified_siwa: true
tags:
  - name: auth
  - name: identity
  - name: internal
paths:
  /:
    get:
      operationId: siwaServerRoot
      tags: [auth]
      responses:
        "200":
          description: Lightweight root response for health probes that request the service root
          content:
            text/plain:
              schema:
                type: string
  /healthz:
    get:
      operationId: siwaServerHealthz
      tags: [auth]
      responses:
        "200":
          description: Simple health check response for the shared SIWA server
          content:
            text/plain:
              schema:
                type: string
  /readyz:
    get:
      operationId: siwaServerReadyz
      tags: [auth]
      responses:
        "200":
          description: Readiness checks passed for the shared SIWA server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more readiness checks failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /metrics:
    get:
      operationId: siwaServerMetrics
      tags: [auth]
      responses:
        "200":
          description: Prometheus scrape payload for the shared SIWA server
          content:
            text/plain:
              schema:
                type: string
  /regent-services-contract.openapiv3.yaml:
    get:
      operationId: regentServicesContractSource
      tags: [auth]
      responses:
        "200":
          description: Source-of-truth contract served by the shared SIWA server
          content:
            application/yaml:
              schema:
                type: string
  /api/shared/identity/status:
    post:
      operationId: getSharedIdentityStatus
      tags: [identity]
      x-regent-route-owner: shared-identity-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityStatusRequest"
      responses:
        "200":
          description: Regent account identity status resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityStatusResponse"
        "400":
          description: Invalid identity status request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Identity status request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Identity status request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/identity/registration-intents:
    post:
      operationId: createSharedIdentityRegistrationIntent
      tags: [identity]
      x-regent-route-owner: shared-identity-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityRegistrationIntentRequest"
      responses:
        "200":
          description: Regent account registration signing payload prepared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityRegistrationIntentResponse"
        "400":
          description: Invalid identity registration intent request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Identity registration intent request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Identity registration intent request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/identity/registration-completions:
    post:
      operationId: completeSharedIdentityRegistration
      tags: [identity]
      x-regent-route-owner: shared-identity-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityRegistrationCompletionRequest"
      responses:
        "200":
          description: Regent account registration completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityRegistrationCompletionResponse"
        "400":
          description: Invalid identity registration completion request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Identity registration completion request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Identity registration completion request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Identity registration completion failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/identity/siwa/nonce:
    post:
      operationId: createSharedIdentitySiwaNonce
      tags: [identity]
      x-regent-route-owner: shared-identity-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentitySiwaNonceRequest"
      responses:
        "200":
          description: Regent account SIWA nonce issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitySiwaNonceResponse"
        "400":
          description: Invalid identity SIWA nonce request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Identity SIWA nonce request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Identity SIWA nonce request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/identity/siwa/verify:
    post:
      operationId: verifySharedIdentitySiwaSession
      tags: [identity]
      x-regent-route-owner: shared-identity-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentitySiwaVerifyRequest"
      responses:
        "200":
          description: Regent account SIWA session verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitySiwaVerifyResponse"
        "400":
          description: Invalid identity SIWA verification request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Identity SIWA verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Identity SIWA verification request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Identity SIWA verification request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Identity SIWA verification failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/nonce:
    post:
      operationId: createSharedAgentSiwaNonce
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiwaNonceRequest"
      responses:
        "200":
          description: Shared SIWA nonce issued for one app audience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiwaNonceResponse"
        "400":
          description: Invalid SIWA nonce request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: SIWA nonce request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: SIWA nonce request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/verify:
    post:
      operationId: verifySharedAgentSiwaSession
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiwaVerifyRequest"
      responses:
        "200":
          description: Shared SIWA identity verified for one app audience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiwaVerifyResponse"
        "400":
          description: Invalid SIWA verification request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Signature or nonce validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: SIWA nonce was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: SIWA verification request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: SIWA verification request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: SIWA verification is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Agent identity lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/siwa/http-verify:
    post:
      operationId: verifySharedSiwaHttpEnvelope
      tags: [auth]
      parameters:
        - in: header
          name: x-siwa-audience
          required: true
          schema:
            type: string
          description: App audience that the SIWA receipt must match for this protected request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiwaHttpVerifyRequest"
      responses:
        "200":
          description: Protected request envelope verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiwaHttpVerifyResponse"
        "400":
          description: Invalid envelope request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Envelope verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Request replay detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: SIWA protected request envelope is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: SIWA protected request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: SIWA HTTP verification is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/health:
    get:
      operationId: siwaKeyringHealth
      tags: [internal]
      responses:
        "200":
          description: Internal signer health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringHealthResponse"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/create-wallet:
    post:
      operationId: siwaKeyringCreateWallet
      tags: [internal]
      security:
        - KeyringHmacTimestamp: []
          KeyringHmacRequestId: []
          KeyringHmacSignature: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: Wallet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringWalletResponse"
        "401":
          description: Internal signer authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Internal signer request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "415":
          description: Internal signer request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "422":
          description: Wallet could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/has-wallet:
    post:
      operationId: siwaKeyringHasWallet
      tags: [internal]
      security:
        - KeyringHmacTimestamp: []
          KeyringHmacRequestId: []
          KeyringHmacSignature: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: Wallet presence check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringHasWalletResponse"
        "401":
          description: Internal signer authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Internal signer request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "415":
          description: Internal signer request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "422":
          description: Wallet presence could not be checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/get-address:
    post:
      operationId: siwaKeyringGetAddress
      tags: [internal]
      security:
        - KeyringHmacTimestamp: []
          KeyringHmacRequestId: []
          KeyringHmacSignature: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: Wallet address lookup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringAddressResponse"
        "401":
          description: Internal signer authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Internal signer request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "415":
          description: Internal signer request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "404":
          description: Wallet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "422":
          description: Wallet address could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/sign-message:
    post:
      operationId: siwaKeyringSignMessage
      tags: [internal]
      security:
        - KeyringHmacTimestamp: []
          KeyringHmacRequestId: []
          KeyringHmacSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyringSignMessageRequest"
      responses:
        "200":
          description: Message signed with the internal keyring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringSignatureResponse"
        "400":
          description: Invalid message signing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "401":
          description: Internal signer authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Internal signer request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "415":
          description: Internal signer request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "422":
          description: Message could not be signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/sign-raw-message:
    post:
      operationId: siwaKeyringSignRawMessage
      tags: [internal]
      security:
        - KeyringHmacTimestamp: []
          KeyringHmacRequestId: []
          KeyringHmacSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyringSignRawMessageRequest"
      responses:
        "200":
          description: Raw payload signed with the internal keyring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringSignatureResponse"
        "400":
          description: Invalid raw-message signing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "401":
          description: Internal signer authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Internal signer request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "415":
          description: Internal signer request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "422":
          description: Raw message could not be signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/sign-transaction:
    post:
      operationId: siwaKeyringSignTransaction
      tags: [internal]
      security:
        - KeyringHmacTimestamp: []
          KeyringHmacRequestId: []
          KeyringHmacSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyringSignTransactionRequest"
      responses:
        "200":
          description: Transaction signed with the internal keyring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringSignedTransactionResponse"
        "400":
          description: Invalid transaction signing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "401":
          description: Internal signer authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Internal signer request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "415":
          description: Internal signer request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "422":
          description: Transaction could not be signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "429":
          $ref: "#/components/responses/RateLimitError"
  /api/shared/keyring/sign-authorization:
    post:
      operationId: siwaKeyringSignAuthorization
      tags: [internal]
      security:
        - KeyringHmacTimestamp: []
          KeyringHmacRequestId: []
          KeyringHmacSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyringSignAuthorizationRequest"
      responses:
        "200":
          description: Authorization payload signed with the internal keyring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyringSignedAuthorizationResponse"
        "400":
          description: Invalid authorization signing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "401":
          description: Internal signer authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Internal signer request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "415":
          description: Internal signer request content type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "422":
          description: Authorization payload could not be signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "429":
          $ref: "#/components/responses/RateLimitError"
components:
  securitySchemes:
    KeyringHmacTimestamp:
      type: apiKey
      in: header
      name: x-keyring-timestamp
    KeyringHmacRequestId:
      type: apiKey
      in: header
      name: x-keyring-request-id
      description: Unique request identifier included in the keyring HMAC payload and consumed once within the timestamp freshness window.
    KeyringHmacSignature:
      type: apiKey
      in: header
      name: x-keyring-signature
  responses:
    RateLimitError:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Address:
      type: string
      pattern: "^0x[a-fA-F0-9]{40}$"
    BaseChainId:
      type: integer
      enum: [8453]
    HexData:
      type: string
      pattern: "^0x[a-fA-F0-9]*$"
    IdentityNetwork:
      type: string
      enum: [base, base-sepolia]
    IdentityProvider:
      type: string
      enum: [coinbase-cdp]
    AgentRegistry:
      type: string
      minLength: 1
    IdentityTokenId:
      type: string
      pattern: "^(0|[1-9][0-9]{0,18})$"
      maxLength: 19
    IdentityStatusRequest:
      type: object
      required: [network, address, provider]
      properties:
        network:
          $ref: "#/components/schemas/IdentityNetwork"
        address:
          $ref: "#/components/schemas/Address"
        provider:
          $ref: "#/components/schemas/IdentityProvider"
        wallet_hint:
          type: string
      additionalProperties: false
    IdentityStatusResponse:
      type: object
      required: [ok, code, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        code:
          type: string
          enum: [identity_status_resolved]
        data:
          type: object
          required: [network, address, provider, registered, verified]
          properties:
            network:
              $ref: "#/components/schemas/IdentityNetwork"
            address:
              $ref: "#/components/schemas/Address"
            provider:
              $ref: "#/components/schemas/IdentityProvider"
            registered:
              type: boolean
            verified:
              type: string
              enum: [unregistered, onchain]
            agent_id:
              type: string
            token_id:
              type: string
            agent_registry:
              $ref: "#/components/schemas/AgentRegistry"
            receipt_expires_at:
              type: string
              format: date-time
          additionalProperties: false
        meta:
          $ref: "#/components/schemas/LooseObject"
      additionalProperties: false
    IdentityRegistrationIntentRequest:
      type: object
      required: [network, address, provider]
      properties:
        network:
          $ref: "#/components/schemas/IdentityNetwork"
        address:
          $ref: "#/components/schemas/Address"
        provider:
          $ref: "#/components/schemas/IdentityProvider"
        wallet_hint:
          type: string
      additionalProperties: false
    IdentityRegistrationIntentResponse:
      type: object
      required: [ok, code, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        code:
          type: string
