<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Geist"; src: url("../../platform/priv/static/fonts/cloak/Geist-Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Geist"; src: url("../../platform/priv/static/fonts/cloak/Geist-SemiBold.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Geist Mono"; src: url("../../platform/priv/static/fonts/regent-ui/GeistMono-Regular.woff2") format("woff2"); font-weight: 400; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative;
  background: #08090C;
  color: #F4F5F8;
  font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* Subtle architectural grid */
.grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.032) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.032) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* Soft ambient glows centered in the iMessage-safe zone */
.glow-left {
  position: absolute;
  left: 140px;
  top: 130px;
  width: 520px;
  height: 440px;
  background: radial-gradient(circle, rgba(130, 165, 255, 0.13) 0%, rgba(130, 165, 255, 0.03) 45%, transparent 72%);
  pointer-events: none;
}
.glow-right {
  position: absolute;
  right: 140px;
  top: 80px;
  width: 540px;
  height: 500px;
  background: radial-gradient(circle, rgba(52, 211, 153, 0.12) 0%, rgba(139, 92, 246, 0.07) 44%, transparent 72%);
  pointer-events: none;
}

/* Subtle hairline frame */
.frame {
  position: absolute;
  inset: 20px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px;
  pointer-events: none;
}

/*
 * Safe-zone layout: full canvas is 1200x630 (1.91:1 for X, Telegram, Discord, Slack),
 * while all foreground typography, the animated Tor startup card, and the dithered
 * crown sit strictly inside the centered 744x630 region (x: 228..972) so iMessage's
 * ~4:3 center crop never clips any text, card, or logo.
 */

/* Top bar: small, bright text centered inside safe zone */
.topbar {
  position: absolute;
  top: 40px;
  left: 240px;
  right: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Geist Mono", ui-monospace, monospace;
  font-size: 13px;
  letter-spacing: 0.015em;
  color: #F7F8FC;
  text-shadow: 0 0 18px rgba(255,255,255,0.22);
  white-space: nowrap;
}
.topbar .sep {
  color: rgba(255,255,255,0.42);
  margin: 0 8px;
}

/* Upper-left middle URL lockup inside safe zone */
.url-hero {
  position: absolute;
  left: 240px;
  top: 204px;
  font-family: "Geist Mono", ui-monospace, monospace;
  font-size: 30px;
  font-weight: 400;
  letter-spacing: -0.025em;
  color: rgba(255,255,255,0.64);
  text-shadow: 0 0 28px rgba(160, 190, 255, 0.18);
  white-space: nowrap;
}
.url-hero strong {
  font-weight: 400;
  color: #FFFFFF;
}

/* Bottom-right dithered logo tile inside safe zone */
.logo-wrap {
  position: absolute;
  right: 240px;
  bottom: 42px;
  width: 144px;
  height: 144px;
  border-radius: 32px;
  background: #060709;
  border: 1px solid rgba(255,255,255,0.16);
  box-shadow:
    0 20px 48px rgba(0,0,0,0.68),
    0 0 0 1px rgba(255,255,255,0.04) inset,
    0 1px 0 rgba(255,255,255,0.16) inset;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.logo-wrap img {
  width: 128px;
  height: 128px;
  display: block;
  image-rendering: pixelated;
}

/* Right-side 5-step Tor startup panel — fully inside the iMessage safe zone */
.tor-panel {
  position: absolute;
  right: 240px;
  top: 96px;
  width: 404px;
  background: linear-gradient(180deg, rgba(28, 30, 36, 0.94) 0%, rgba(19, 20, 25, 0.96) 100%);
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 18px;
  padding: 18px 19px 20px;
  box-shadow:
    0 20px 52px rgba(0,0,0,0.72),
    0 1px 0 rgba(255,255,255,0.12) inset;
}

.tor-head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 13px;
}
.tor-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: #F5F6F9;
}
.tor-timer {
  font-size: 14.5px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  color: rgba(255,255,255,0.48);
  margin-left: 2px;
}

.steps {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.step {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12.6px;
  line-height: 1.25;
  white-space: nowrap;
}
.step.done { color: rgba(255,255,255,0.68); }
.step.active { color: #FFFFFF; font-weight: 600; }
.step.pending { color: rgba(255,255,255,0.34); }

.icon-slot {
  width: 19px;
  height: 19px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* Green check circle */
.check {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #22C55E;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 12px rgba(34, 197, 94, 0.45);
}
.check svg { width: 11px; height: 11px; }

/* Pending hollow circle */
.circle {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.28);
}

/* Native macOS 8-spoke spinner */
.spinner {
  width: 18px;
  height: 18px;
  position: relative;
}
.spinner i {
  position: absolute;
  left: 8px;
  top: 1.5px;
  width: 2px;
  height: 4.5px;
  border-radius: 1.2px;
  background: #FFFFFF;
  transform-origin: 1px 7.5px;
}

/* Bottom-left large headline inside safe zone */
.headline-wrap {
  position: absolute;
  left: 240px;
  bottom: 58px;
}
.headline {
  font-size: 57px;
  font-weight: 600;
  line-height: 0.96;
  letter-spacing: -0.04em;
  color: #FFFFFF;
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow-left"></div>
<div class="glow-right"></div>
<div class="frame"></div>

<div class="topbar">
  <div>
    open-source<span class="sep">--</span>macOS<span class="sep">--</span>local models<span class="sep">--</span>verifiable private cloud AI
  </div>
</div>

<div class="url-hero">regents.sh/<strong>cloak</strong></div>

<div class="tor-panel">
  <div class="tor-head">
    <div class="icon-slot"><div class="spinner" id="head-spinner"></div></div>
    <div class="tor-title">Starting Cloak…</div>
    <div class="tor-timer" id="timer">0:04</div>
  </div>
  <div class="steps" id="steps"></div>
</div>

<div class="headline-wrap">
  <h1 class="headline">Cloak your agents</h1>
</div>

<div class="logo-wrap">
  <img id="crown" src="" alt="Cloak dithered crown" />
</div>

<script>
const STEP_TEXTS = [
  "Checking Mac hardware and verified binaries.",
  "Connecting to the Tor network.",
  "Loading local prompt rewriter model into memory.",
  "Booting isolated Linux VM.",
  "Verifying Tor routing, prompt rewriting, and isolation."
];

function buildSpinner(el, phase) {
  el.innerHTML = "";
  const spokes = 8;
  for (let i = 0; i < spokes; i++) {
    const spoke = document.createElement("i");
    const angle = i * (360 / spokes);
    const dist = (spokes - ((i - phase) % spokes + spokes) % spokes) % spokes;
    const opacity = Math.max(0.18, 1 - dist * 0.12);
    spoke.style.transform = `rotate(${angle}deg)`;
    spoke.style.opacity = opacity.toFixed(2);
    el.appendChild(spoke);
  }
}

const CHECK_SVG = `<div class="check"><svg viewBox="0 0 14 14" fill="none"><path d="M2.8 7.4L5.6 10.2L11.3 4.1" stroke="#08120B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;

window.renderState = function({ frameSrc, activeIndex, timerText, spinPhase }) {
  document.getElementById("crown").src = frameSrc;
  document.getElementById("timer").textContent = timerText;
  buildSpinner(document.getElementById("head-spinner"), spinPhase);

  const container = document.getElementById("steps");
  container.innerHTML = "";
  STEP_TEXTS.forEach((label, idx) => {
    const row = document.createElement("div");
    let cls = "pending";
    if (idx < activeIndex) cls = "done";
    else if (idx === activeIndex) cls = "active";
    row.className = `step ${cls}`;

    const slot = document.createElement("div");
    slot.className = "icon-slot";
    if (cls === "done") {
      slot.innerHTML = CHECK_SVG;
    } else if (cls === "active") {
      const sp = document.createElement("div");
      sp.className = "spinner";
      buildSpinner(sp, spinPhase);
      slot.appendChild(sp);
    } else {
      slot.innerHTML = `<div class="circle"></div>`;
    }

    const txt = document.createElement("span");
    txt.textContent = label;
    row.appendChild(slot);
    row.appendChild(txt);
    container.appendChild(row);
  });
};
</script>
</body>
</html>
