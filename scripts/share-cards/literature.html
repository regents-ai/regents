<!doctype html>
<html>
<head>

<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

.chart { position: absolute; right: 40px; top: 32px; bottom: 32px; width: 1000px; display: flex; align-items: center; justify-content: flex-end; }

</head>
<body>
<div class="copy">
  <p class="eyebrow">Regents Labs · Literature</p>
  <h1>Hope for people, hope for machines</h1>
